name: Keep Backend Alive

on:
  schedule:
    # Runs every 12 minutes (Render free tier spins down after 15 mins)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://skillbridge-6fky.onrender.com"
          fi
          echo "Pinging $RENDER_URL/api/v1/health..."
          curl -s -f "$RENDER_URL/api/v1/health" || echo "Backend waking up or unreachable"
