services:
  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: careeros-backend
    env: node
    plan: free
    region: oregon
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOW_DEV_LOGIN
        value: "true"
      - key: MONGO_URI
        sync: false # Set in Render Dashboard
      - key: CLIENT_URL
        sync: false # Set to Netlify URL (e.g. https://careeros.netlify.app)
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
